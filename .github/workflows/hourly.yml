# M13 hourly runner: refresh, predict, grade, publish the page (GitHub Pages).
#
# Every hour on the hour from 7am to 10pm America/New_York, 16 runs a day. Cron is UTC only,
# so this fires every hour of 11:00-03:00 UTC (7am-10pm in both EDT and EST); the `gate` job
# exits at once for the hour that is outside 7am-10pm Eastern (src/betdata/runner/window.py).
#
# State (the SQLite database, the frozen model fit, cached features, the last good page) lives
# in the Actions cache: restored at the start, saved as a new entry at the end. If it is gone
# (evicted, or `drop_state` below), the run rebuilds the history from free nflverse files and
# the page says so. A failed run republishes the last good page with a failure warning.
#
# Manual runs (Actions -> hourly -> Run workflow) ignore the clock.

name: hourly

on:
  schedule:
    - cron: "0 0-3,11-23 * * *"
    # Backup: GitHub drops some top-of-hour scheduled runs under load. A slot that already
    # ran successfully is skipped, so this only runs when the :00 run did not.
    - cron: "30 0-3,11-23 * * *"
  workflow_dispatch:
    inputs:
      drop_state:
        description: "Ignore the saved state, as if it were lost (lost-state test)"
        type: boolean
        default: false
      trigger:
        description: "Who started this run (the clock workflow passes 'clock'; leave empty)"
        type: string
        default: ""
      force_fail:
        description: "Fail the run on purpose with this message (failure test)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/betdata/runner/window.py
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          RUN_TRIGGER: ${{ inputs.trigger }}
        run: python3 src/betdata/runner/window.py

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # the pick ledger and the weekly report are committed to main
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Keys only from GitHub Secrets; a missing one means that source is skipped (and listed
      # on the page). ODDS_API_KEY is the name .env.example uses; THE_ODDS_API_KEY also works.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || secrets.THE_ODDS_API_KEY }}
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      FORCE_FAIL: ${{ inputs.force_fail }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-dev
      - name: Restore state
        id: restore
        if: ${{ !inputs.drop_state }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/betdata.sqlite
            data/derived
            data/site_last_good
            data/reports
          key: betdata-state-v1-${{ github.run_id }}
          restore-keys: betdata-state-v1-
      # The poller's own database, read only (never saved by this job): NFL grading reads
      # Pinnacle's pre-game close from it (nfl/book_lines.py), the Alerts step its alerts.
      - name: Restore poller database
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: data/poller.sqlite
          key: betdata-poller-v1-${{ github.run_id }}
          restore-keys: betdata-poller-v1-
      # The permanent pick ledger (betdata/ledger.py): new picks and newly final results from
      # the poller database are appended to ledger/*.csv before the page is built, so the
      # Value section's all-time record and the CSV download include them.
      - name: Ledger sync
        id: ledger
        continue-on-error: true
        run: uv run --no-dev betdata ledger sync
      - name: Run
        id: run
        continue-on-error: true
        run: |
          args=(--trigger "${{ inputs.trigger || github.event_name }}")
          if [ -n "$FORCE_FAIL" ]; then args+=(--fail "$FORCE_FAIL"); fi
          uv run --no-dev betdata runner run "${args[@]}" 2>&1 | tee run.log
          status="${PIPESTATUS[0]}"
          if grep -q '^slot already done' run.log; then echo "skipped=true" >> "$GITHUB_OUTPUT"; fi
          exit "$status"
      - name: Save state
        if: ${{ always() && steps.run.outputs.skipped != 'true' && hashFiles('data/betdata.sqlite') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/betdata.sqlite
            data/derived
            data/site_last_good
            data/reports
          key: betdata-state-v1-${{ github.run_id }}
      - name: Failure page
        if: steps.run.outcome == 'failure'
        run: |
          msg=$(grep -m1 '^run failed:' run.log | cut -c13- || true)
          uv run --no-dev betdata runner failed-page --message "${msg:-the hourly run failed}" \
            --url "$RUN_URL"
      # M16 Alerts section: an isolated post-step on the built page (the poller database is
      # restored before the run; any failure leaves the page as built).
      - name: Alerts section
        if: steps.run.outputs.skipped != 'true'
        continue-on-error: true
        run: uv run --no-dev betdata alerts page
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.skipped != 'true'
        with:
          path: site
      - id: deploy
        if: steps.run.outputs.skipped != 'true'
        uses: actions/deploy-pages@v4
      # Mondays after the morning run: the weekly report; any run: milestone pushes (60 / 200
      # graded picks). Then the ledger and the report are committed to main (append-only
      # files; a rebase-and-retry loop if main moved).
      - name: Weekly report and pushes
        if: steps.run.outputs.skipped != 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run --no-dev betdata ledger publish
      - name: Commit the ledger
        if: ${{ always() && steps.run.outputs.skipped != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger reports/weekly 2>/dev/null || true
          if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
          git commit -qm "Ledger: picks and results as of $(date -u +%FT%H:%MZ) [skip ci]"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::could not push the ledger"; exit 1
      - name: Report the failed run
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::the hourly run failed; the last good page was republished with a warning"
          exit 1
