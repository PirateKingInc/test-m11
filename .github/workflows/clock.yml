# The hourly page's clock. GitHub's own cron drops scheduled runs under load (on Oct 19-20 it
# started 2 of ~20 hourly ticks), so this workflow keeps time itself: it sleeps until just after
# the next hour, dispatches the hourly run if that hour is 7am-10pm Eastern, then dispatches
# itself again. Dispatches made with the workflow token do start runs (GitHub's exception for
# workflow_dispatch). Only one clock runs at a time (a newer one cancels an older one), and the
# cron below restarts the chain if it ever breaks. Hourly runs it starts are recorded with
# trigger "clock"; a slot already run by cron or clock is skipped, so they never double up.
#
# M16: the `poll` job runs the alert poller beside the clock for the same hour (MODEL.md and
# PROJECT.md "M16"). It is a separate job: if it fails, the clock and the hourly page are
# untouched. It reads the hourly state as a throwaway copy (restored, never saved here), keeps
# its own database under its own cache key, pauses while an hourly run is queued or running,
# and stops at :56, before the next clock run starts (which would cancel it).

name: clock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: clock
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/betdata/runner/window.py
          sparse-checkout-cone-mode: false
      - id: wait
        name: Wait for the next hour
        env:
          RUN_TRIGGER: clock
        run: python3 src/betdata/runner/window.py --wait
      - name: Start the hourly run
        if: steps.wait.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hourly.yml --repo "${{ github.repository }}" --ref main -f trigger=clock
      - name: Keep the clock going
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clock.yml --repo "${{ github.repository }}" --ref main

  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    # contents: write only to force-push today's tracker (tracker.json) to the `tracker` branch,
    # never main (alerts/tracker.py).
    permissions:
      actions: write
      contents: write
    # Keys live in this environment (main only); nothing is deployed from this job.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-dev
      - name: Restore the hourly state (a read-only copy; never saved by this job)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/betdata.sqlite
            data/derived
            data/site_last_good
            data/reports
          key: betdata-state-v1-${{ github.run_id }}
          restore-keys: betdata-state-v1-
      - name: Restore the poller database
        uses: actions/cache/restore@v4
        with:
          path: data/poller.sqlite
          key: betdata-poller-v1-${{ github.run_id }}
          restore-keys: betdata-poller-v1-
      - name: Poll until :56
        if: ${{ hashFiles('data/betdata.sqlite') != '' }}
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # optional: live scores for today's tracker (balldontlie free tier); unset = no scores
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-dev betdata poller run
      - name: Save the poller database
        if: ${{ always() && hashFiles('data/poller.sqlite') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/poller.sqlite
          key: betdata-poller-v1-${{ github.run_id }}
