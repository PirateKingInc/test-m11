# M16: which expected secrets are set (prints SET / MISSING only, never a value). Runs in the
# github-pages environment, where the hourly runner's secrets live.

name: secrets-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Report which secrets are set
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          for k in SHARPAPI_KEY SPORTSGAMEODDS_API_KEY ODDS_API_KEY NTFY_TOPIC ODDSPAPI_KEY CFBD_API_KEY; do
            if [ -n "${!k}" ]; then echo "$k SET"; else echo "$k MISSING"; fi
          done
