# Checks the live page from outside (manual): fetches it, prints status.json, and takes a
# phone-width (390 px) screenshot with Playwright. The screenshot and the fetched files are
# pushed to the `proof` branch (one orphan commit, replaced each time) so they can be viewed
# without access to the Pages host.

name: verify-page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the page
        run: |
          mkdir -p proof
          url="https://piratekinginc.github.io/test-m11/"
          curl -sS -o proof/index.html -w "index.html HTTP %{http_code}\n" "$url"
          curl -sS -o proof/status.json -w "status.json HTTP %{http_code}\n" "${url}status.json"
          cat proof/status.json
          grep -o 'Last updated: <span id="updated">[^<]*' proof/index.html || true
      - name: Screenshot at 390 px
        run: |
          # The runner image ships Google Chrome; drive it rather than installing a browser.
          pip install --quiet playwright
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(channel="chrome")
              pg = b.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=2)
              pg.goto("https://piratekinginc.github.io/test-m11/", wait_until="networkidle")
              pg.screenshot(path="proof/phone.png")
              pg.screenshot(path="proof/phone_full.png", full_page=True)
              pg.screenshot(path="proof/phone_top.png", full_page=True,
                            clip={"x": 0, "y": 0, "width": 390, "height": 2400})
              print("scrollWidth", pg.evaluate("document.documentElement.scrollWidth"))
              print("warning:", pg.evaluate("document.getElementById('warn').hidden ? '(none)' : document.getElementById('warn').textContent"))
              print("updated:", pg.evaluate("document.getElementById('updated').textContent"))
              def props_shot(sport):
                  # M15: the tab's props section, top 1,400 px, at phone width.
                  sec = pg.locator(f"#tab-{sport} section.props")
                  if sec.count():
                      top, height = sec.first.evaluate(
                          "e => [e.getBoundingClientRect().top + window.scrollY, e.offsetHeight]")
                      pg.screenshot(path=f"proof/{sport}_props_phone.png", full_page=True,
                                    clip={"x": 0, "y": top, "width": 390,
                                          "height": min(height, 1400)})
                      print(f"{sport} props rows:", sec.first.locator("li.prop").count())
              def value_shot(sport):
                  # M18: the tab's Value section, top 1,400 px, at phone width.
                  sec = pg.locator(f"#tab-{sport} section.value")
                  if sec.count():
                      top, height = sec.first.evaluate(
                          "e => [e.getBoundingClientRect().top + window.scrollY, e.offsetHeight]")
                      pg.screenshot(path=f"proof/{sport}_value_phone.png", full_page=True,
                                    clip={"x": 0, "y": top, "width": 390,
                                          "height": min(height, 1400)})
                      print(f"{sport} value:", sec.first.inner_text()[:900])
                  else:
                      print(f"{sport} value: no section")
              value_shot("nfl")
              props_shot("nfl")
              # M17: the NFL engine section ("Engine vs market"), top 1,600 px.
              eng = pg.locator("#tab-nfl section.engine")
              if eng.count():
                  top, height = eng.first.evaluate(
                      "e => [e.getBoundingClientRect().top + window.scrollY, e.offsetHeight]")
                  pg.screenshot(path="proof/nfl_engine_phone.png", full_page=True,
                                clip={"x": 0, "y": top, "width": 390,
                                      "height": min(height, 1600)})
                  print("engine games:", eng.first.locator("article.game").count())
                  print("engine:", eng.first.inner_text()[:900])
              else:
                  print("engine: no section")
              # M14: the NBA tab, opened the way a reader would.
              nba = pg.locator('button[data-tab="nba"]')
              if nba.count():
                  nba.click()
                  pg.wait_for_timeout(300)
                  pg.screenshot(path="proof/nba_phone.png")
                  pg.screenshot(path="proof/nba_phone_full.png", full_page=True)
                  print("nba tab:", pg.evaluate("document.getElementById('tab-nba').innerText.slice(0, 600)"))
                  print("nba scrollWidth", pg.evaluate("document.documentElement.scrollWidth"))
                  value_shot("nba")
                  props_shot("nba")
              b.close()
          PY
      - name: Push to the proof branch
        run: |
          cd proof
          git init -q -b proof
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Live page check $(date -u +%FT%TZ) (run ${{ github.run_id }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" proof
