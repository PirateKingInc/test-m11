# Throwaway (M14): which free NBA sources answer from a GitHub Actions runner. Results are
# pushed to the `probe-out` branch. Not merged to main.
name: probe
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash probe/run.sh
      - name: Push results
        if: always()
        run: |
          cd out
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "probe $(date -u +%FT%TZ) run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
