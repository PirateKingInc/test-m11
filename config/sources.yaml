# Per-source settings. Secrets live in .env; this file only names the env var.
# Quota limits are the published free tiers. `safety_margin` is held back and never spent.
# The QuotaManager enforces these regardless of what any schedule asks for.

sources:
  the_odds_api:
    enabled: true
    api_key_env: ODDS_API_KEY
    base_url: https://api.the-odds-api.com/v4
    quota: {limit: 500, period: month, reset_day: 1, safety_margin: 0.10}
    regions: [us]
    markets: [h2h, spreads, totals]
    odds_format: american
    sport_keys:
      nfl: americanfootball_nfl
      ncaaf: americanfootball_ncaaf
      nba: basketball_nba
      ncaab: basketball_ncaab

  nflverse:
    enabled: true
    base_url: https://github.com/nflverse/nflverse-data/releases/download
    # No quota: static files on GitHub releases. Unchanged files are not re-archived.

  nflverse_extra:
    enabled: true
    base_url: https://github.com/nflverse/nflverse-data/releases/download
    # M15 parquet files (participation, FTN, PFR, depth charts, player stats, NGS) saved under
    # data/nflverse/. No quota. Not scheduled yet: `betdata backfill --source nflverse_extra`.

  nfl_model:
    enabled: true
    # Local M12 jobs (derive / predict / grade); no network, no quota.

  nba_cdn:
    enabled: true
    base_url: https://cdn.nba.com/static/json
    # No quota. nba.com's servers expect a browser-like referer; nba_api sends these too.
    headers: {Referer: "https://www.nba.com/", Origin: "https://www.nba.com", Accept: "application/json"}

  espn_nba:
    enabled: true
    # ESPN's public APIs: no key, no published quota. Kept polite: one request per 0.5 s. The
    # hourly run makes 1 scoreboard call plus a summary per newly finished game (M14).
    min_interval_seconds: 0.5

  nba_injury:
    enabled: true
    base_url: https://ak-static.cms.nba.com/referee/injury
    # The league's PDFs. No quota, but the server refused a burst of ~2,000 requests from one
    # runner (M14 probe); one request a second is accepted.
    min_interval_seconds: 1.0

  espn_props:
    enabled: true
    # ESPN's player prop lines (M15): no key, no quota, unofficial. One request per second;
    # per game, the providers list plus each book's propBets (1-3 requests).
    min_interval_seconds: 1.0

  sportsdataverse:
    enabled: true
    base_url: https://github.com/sportsdataverse/sportsdataverse-data/releases/download
    # No quota: static files on GitHub releases. Unchanged files are not re-archived.

  oddspapi:
    enabled: true
    api_key_env: ODDSPAPI_KEY
    base_url: https://api.oddspapi.io/v4
    quota: {limit: 250, period: month, reset_day: 1, safety_margin: 0.10}  # vendor's figure
    bookmaker: pinnacle  # one book per call; Pinnacle = sharp reference line
    sport_ids: {nfl: 14, ncaaf: 14, nba: 11, ncaab: 11}
    # Fill missing ids from `betdata run oddspapi tournaments --sport nba` (1 call each).
    # A league left empty is skipped, not failed. NFL = 31 per the vendor's NFL guide.
    tournaments: {nfl: 31, nba: null, ncaaf: null, ncaab: null}
    participant1_is_home: true  # unverified; check one fixture against the real schedule
    # marketId -> {market, outcomes: {outcomeId: home|away|over|under}, [line]}.
    # Only the NBA moneyline is documented (vendor tutorial). Fill the rest from
    # `betdata run oddspapi markets --sport nba`, then `betdata reparse oddspapi <raw_id>`.
    markets:
      nba:
        "111": {market: h2h, outcomes: {"111": home, "112": away}}

  sharpapi:
    enabled: true
    api_key_env: SHARPAPI_KEY
    base_url: https://api.sharpapi.io/api/v1
    min_interval_seconds: 10  # <= 6 requests/minute; free tier allows 12
    # Runaway guard only (12/min would be 17,280/day); normal use is a few hundred a day.
    quota: {limit: 3000, period: day, safety_margin: 0.0, burst: 1.0}
    sportsbooks: [draftkings, fanduel]  # the two books on the free tier
    markets: [moneyline, point_spread, total_points]  # SDK spelling; see sharpapi.py docstring
    pregame_only: true
    main_lines_only: true  # free tier: most rows are alternate lines (REVIEW M16-3)
    horizon_hours: 192  # free-tier paging stops once a page reaches events past this
    leagues: {nfl: nfl, nba: nba, ncaaf: ncaaf, ncaab: ncaab}  # college ids unverified

  cfbd:
    enabled: true
    api_key_env: CFBD_API_KEY
    football_base_url: https://api.collegefootballdata.com
    basketball_base_url: https://api.collegebasketballdata.com
    # One quota shared by football and basketball.
    quota: {limit: 1000, period: month, reset_day: 1, safety_margin: 0.10}

  open_meteo:
    enabled: true
    forecast_url: https://api.open-meteo.com/v1
    archive_url: https://archive-api.open-meteo.com/v1
    min_interval_seconds: 1
    # ~10,000/day free (non-commercial, CC BY 4.0). Weighted: locations x 2-week blocks.
    quota: {limit: 10000, period: day, safety_margin: 0.5, burst: 1.0}
