# Unattended polling schedule. Cron expressions are in `timezone`.
#
# `when` gates a job on the games table: it only runs if at least one not-final game of
# `sport` kicks off in (now + after_minutes, now + before_minutes]. A gated-out tick costs
# nothing and is not logged as a run. The QuotaManager still has the final say on spend.
#
# Check projected spend before changing anything:  betdata scheduler plan --days 30

timezone: America/New_York

defaults:
  priority: normal
  misfire_grace_minutes: 30  # if the machine was asleep at fire time, still run within this

jobs:
  # --- nflverse: free; schedule, scores, current and closing lines ---------------------
  - id: nflverse-schedules-morning
    source: nflverse
    job: schedules
    cron: "15 7 * * *"
    misfire_grace_minutes: 720

  - id: nflverse-schedules-night  # picks up final scores the same night
    source: nflverse
    job: schedules
    cron: "45 23 * * *"
    misfire_grace_minutes: 360

  # --- The Odds API (500 credits/month) -------------------------------------------------
  - id: odds-nfl-events  # free; keeps event ids current
    source: the_odds_api
    job: events
    params: {sport: nfl}
    cron: "30 6 * * *"
    misfire_grace_minutes: 720
    when: {sport: nfl, after_minutes: 0, before_minutes: 14400}  # games in next 10 days

  # One multi-book snapshot 0-60 min before every NFL kickoff window (London, 1pm, 4pm,
  # TNF/SNF/MNF, Saturdays, holidays). 3 credits per window, ~80 credits/month in season.
  # nflverse already supplies a free daily line, so no separate "opener" poll here.
  - id: odds-nfl-prekick
    source: the_odds_api
    job: odds
    params: {sport: nfl}
    cron: "50 * * * *"
    misfire_grace_minutes: 15
    when: {sport: nfl, after_minutes: 0, before_minutes: 60}

  # --- NBA, college basketball, college football ------------------------------------------
  # Schedules come from CFBD (college) and nba_cdn / sportsdataverse (NBA); these free /events
  # lists add The Odds API's own event ids. Gated by month rather than by known games.
  # Worst-case month (Nov: all four sports, NBA weekend matinees every weekend): ~330 of
  # 450 usable credits. `betdata scheduler plan` gives the real projection once games load.

  - id: odds-nba-events
    source: the_odds_api
    job: events
    params: {sport: nba}
    cron: "35 6 * * *"
    misfire_grace_minutes: 720
    active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]

  - id: odds-nba-evening  # before the 7pm tips; covers every game through midnight
    source: the_odds_api
    job: odds
    params: {sport: nba}
    cron: "40 18 * * *"
    when: {sport: nba, after_minutes: 0, before_minutes: 330}

  - id: odds-nba-weekend-day  # weekend matinees (noon-4:30pm tips)
    source: the_odds_api
    job: odds
    params: {sport: nba}
    cron: "40 11 * * 0,6"
    when: {sport: nba, after_minutes: 0, before_minutes: 300}

  - id: odds-ncaab-events
    source: the_odds_api
    job: events
    params: {sport: ncaab}
    cron: "40 6 * * *"
    misfire_grace_minutes: 720
    active_months: [11, 12, 1, 2, 3, 4]

  - id: odds-ncaab-evening  # 6pm-midnight tips, where most weekday games are
    source: the_odds_api
    job: odds
    params: {sport: ncaab}
    cron: "40 17 * * *"
    when: {sport: ncaab, after_minutes: 0, before_minutes: 420}

  - id: odds-ncaab-saturday-day
    source: the_odds_api
    job: odds
    params: {sport: ncaab}
    cron: "40 11 * * 6"
    when: {sport: ncaab, after_minutes: 0, before_minutes: 330}

  - id: odds-ncaaf-events
    source: the_odds_api
    job: events
    params: {sport: ncaaf}
    cron: "45 6 * * *"
    misfire_grace_minutes: 720
    active_months: [8, 9, 10, 11, 12, 1]

  - id: odds-ncaaf-saturday  # before the noon, 3:30 and 7:30 Saturday windows
    source: the_odds_api
    job: odds
    params: {sport: ncaaf}
    cron: "40 11,15,19 * * 6"
    when: {sport: ncaaf, after_minutes: 0, before_minutes: 120}

  # --- CFBD (1,000 calls/month shared by football and basketball) ---------------------------
  # CFBD is the schedule authority for college; these also bring scores and free opening /
  # current / closing lines from several providers. ~70 calls/month in football season,
  # ~60 in basketball season, ~130 when both run (Nov-Jan) of 900 usable.

  - id: cfbd-ncaaf-games
    source: cfbd
    job: games_football
    cron: "20 7 * * *"
    misfire_grace_minutes: 720
    active_months: [8, 9, 10, 11, 12, 1]

  - id: cfbd-ncaaf-games-saturday-night  # final scores the same night
    source: cfbd
    job: games_football
    cron: "55 23 * * 6"
    misfire_grace_minutes: 360
    active_months: [8, 9, 10, 11, 12, 1]

  - id: cfbd-ncaaf-lines
    source: cfbd
    job: lines_football
    cron: "25 7 * * *"
    misfire_grace_minutes: 720
    active_months: [8, 9, 10, 11, 12, 1]

  - id: cfbd-ncaab-games  # rolling window: 3 days back (scores) to 8 days ahead
    source: cfbd
    job: games_basketball
    cron: "30 7 * * *"
    misfire_grace_minutes: 720
    active_months: [11, 12, 1, 2, 3, 4]

  - id: cfbd-ncaab-lines
    source: cfbd
    job: lines_basketball
    cron: "35 7 * * *"
    misfire_grace_minutes: 720
    active_months: [11, 12, 1, 2, 3, 4]

  # --- SharpAPI (free: DraftKings + FanDuel, 12 req/min; we space calls >= 10 s) -------------
  # Every 10 minutes while a game starts within 3 hours, hourly while one starts within a day.
  # Snapshots are change-only, so frequent polling costs little storage; the last poll before
  # tip is the closing line in v_closing_lines. A few hundred requests/day at most.

  - id: sharp-nfl-near
    source: sharpapi
    job: odds
    params: {sport: nfl}
    cron: "*/10 * * * *"
    misfire_grace_minutes: 5
    when: {sport: nfl, after_minutes: 0, before_minutes: 180}

  - id: sharp-nfl-day
    source: sharpapi
    job: odds
    params: {sport: nfl}
    cron: "5 * * * *"
    misfire_grace_minutes: 30
    when: {sport: nfl, after_minutes: 180, before_minutes: 1440}

  - id: sharp-nba-near
    source: sharpapi
    job: odds
    params: {sport: nba}
    cron: "*/10 * * * *"
    misfire_grace_minutes: 5
    when: {sport: nba, after_minutes: 0, before_minutes: 180}

  - id: sharp-nba-day
    source: sharpapi
    job: odds
    params: {sport: nba}
    cron: "5 * * * *"
    misfire_grace_minutes: 30
    when: {sport: nba, after_minutes: 180, before_minutes: 1440}

  - id: sharp-ncaab-near
    source: sharpapi
    job: odds
    params: {sport: ncaab}
    cron: "*/10 * * * *"
    misfire_grace_minutes: 5
    when: {sport: ncaab, after_minutes: 0, before_minutes: 180}

  - id: sharp-ncaab-day
    source: sharpapi
    job: odds
    params: {sport: ncaab}
    cron: "5 * * * *"
    misfire_grace_minutes: 30
    when: {sport: ncaab, after_minutes: 180, before_minutes: 1440}

  - id: sharp-ncaaf-near
    source: sharpapi
    job: odds
    params: {sport: ncaaf}
    cron: "*/10 * * * *"
    misfire_grace_minutes: 5
    when: {sport: ncaaf, after_minutes: 0, before_minutes: 180}

  - id: sharp-ncaaf-day
    source: sharpapi
    job: odds
    params: {sport: ncaaf}
    cron: "5 * * * *"
    misfire_grace_minutes: 30
    when: {sport: ncaaf, after_minutes: 180, before_minutes: 1440}

  # --- OddsPapi (~250 requests/month): one Pinnacle board per league before game time ------
  # ~80 requests/month at peak. Leagues without a tournament id in sources.yaml are skipped.

  - id: papi-nfl
    source: oddspapi
    job: odds
    params: {sport: nfl}
    cron: "30 11 * * 0"  # Sunday before the early games
    when: {sport: nfl, after_minutes: 0, before_minutes: 150}

  - id: papi-nfl-primetime
    source: oddspapi
    job: odds
    params: {sport: nfl}
    cron: "30 19 * * 1,4"  # Monday and Thursday night
    when: {sport: nfl, after_minutes: 0, before_minutes: 150}

  - id: papi-nba
    source: oddspapi
    job: odds
    params: {sport: nba}
    cron: "30 17 * * *"
    when: {sport: nba, after_minutes: 0, before_minutes: 420}

  - id: papi-ncaab
    source: oddspapi
    job: odds
    params: {sport: ncaab}
    cron: "0 17 * * *"
    when: {sport: ncaab, after_minutes: 0, before_minutes: 420}

  - id: papi-ncaaf
    source: oddspapi
    job: odds
    params: {sport: ncaaf}
    cron: "0 11 * * 6"
    when: {sport: ncaaf, after_minutes: 0, before_minutes: 600}

  # --- NBA schedule and scores (no quota) --------------------------------------------------
  # nba_cdn (NBA's own feed) is the authority; sportsdataverse (ESPN data, up to a day behind)
  # keeps schedules and scores flowing if NBA's servers refuse this machine.

  - id: nba-cdn-schedule
    source: nba_cdn
    job: schedule
    cron: "10 7 * * *"
    misfire_grace_minutes: 720
    active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]

  - id: nba-cdn-scoreboard  # same-night finals, before and after the late West Coast games
    source: nba_cdn
    job: scoreboard
    cron: "50 23,1 * * *"
    misfire_grace_minutes: 60
    active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]

  - id: sdv-nba-schedule
    source: sportsdataverse
    job: schedule
    params: {sport: nba}
    cron: "15 8 * * *"
    misfire_grace_minutes: 720
    active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]

  - id: sdv-ncaab-schedule  # backup for CFBD's college basketball scores; joins by ESPN id
    source: sportsdataverse
    job: schedule
    params: {sport: ncaab}
    cron: "20 8 * * *"
    misfire_grace_minutes: 720
    active_months: [11, 12, 1, 2, 3, 4]

  # --- Weather (Open-Meteo, ~10,000 calls/day; we use a few hundred) -----------------------
  # Forecasts every 3 hours for outdoor/retractable NFL and college football games in the next
  # 7 days (each kept, so lead time is preserved); reanalysis "observed" weather once the
  # archive has caught up (~6 days after the game).

  - id: weather-forecast-nfl
    source: open_meteo
    job: forecast
    params: {sport: nfl}
    cron: "20 */3 * * *"
    misfire_grace_minutes: 60
    when: {sport: nfl, after_minutes: 0, before_minutes: 10080}

  - id: weather-forecast-ncaaf
    source: open_meteo
    job: forecast
    params: {sport: ncaaf}
    cron: "25 */3 * * *"
    misfire_grace_minutes: 60
    when: {sport: ncaaf, after_minutes: 0, before_minutes: 10080}

  - id: weather-observed-nfl
    source: open_meteo
    job: observed
    params: {sport: nfl}
    cron: "40 5 * * *"
    misfire_grace_minutes: 720
    active_months: [9, 10, 11, 12, 1, 2]

  - id: weather-observed-ncaaf
    source: open_meteo
    job: observed
    params: {sport: ncaaf}
    cron: "45 5 * * *"
    misfire_grace_minutes: 720
    active_months: [8, 9, 10, 11, 12, 1, 2]

  # --- NFL injuries and play-by-play (nflverse, no quota) ----------------------------------

  - id: nflverse-injuries  # after the day's practice/injury reports; change-only history
    source: nflverse
    job: injuries
    cron: "20 18 * * *"
    misfire_grace_minutes: 360
    active_months: [9, 10, 11, 12, 1, 2]

  - id: nflverse-pbp  # nightly rebuild of the current season's play-by-play file
    source: nflverse
    job: pbp
    cron: "40 7 * * *"
    misfire_grace_minutes: 720
    active_months: [9, 10, 11, 12, 1, 2]

  # --- NFL team stats, snap counts, rosters (unit model inputs; nflverse, no quota) ---------

  - id: nflverse-team-stats  # team pass/run EPA per game, rebuilt nightly
    source: nflverse
    job: team_stats
    cron: "50 7 * * *"
    misfire_grace_minutes: 720
    active_months: [9, 10, 11, 12, 1, 2]

  - id: nflverse-snaps  # snaps per player per game: who the starters are
    source: nflverse
    job: snaps
    cron: "55 7 * * *"
    misfire_grace_minutes: 720
    active_months: [9, 10, 11, 12, 1, 2]

  - id: nflverse-rosters  # weekly roster status: injured reserve, released; before kickoffs
    source: nflverse
    job: rosters
    cron: "30 18 * * *"
    misfire_grace_minutes: 360
    active_months: [9, 10, 11, 12, 1, 2]

  # --- M12 NFL model (local jobs, no network: nfl_model) -------------------------------------
  # Derived tables after the nightly nflverse refresh; grading once a day; predictions after the
  # day's final injury reports and again 75 minutes before each kickoff window (prekick, after
  # inactives), with a weekly-roster refresh just before so inactives are picked up when
  # nflverse has published them.

  - id: nfl-model-derive
    source: nfl_model
    job: derive
    cron: "15 8 * * *"
    misfire_grace_minutes: 720
    active_months: [9, 10, 11, 12, 1, 2]

  - id: nfl-model-grade
    source: nfl_model
    job: grade
    cron: "30 9 * * *"
    misfire_grace_minutes: 720
    active_months: [9, 10, 11, 12, 1, 2]

  - id: nfl-model-predict-report  # final reports are out by 16:00 ET (Wed, Fri, Sat)
    source: nfl_model
    job: predict
    cron: "15 17 * * *"
    misfire_grace_minutes: 180
    when: {sport: nfl, after_minutes: 0, before_minutes: 11520}  # games in the next 8 days

  - id: nflverse-rosters-gameday
    source: nflverse
    job: rosters
    cron: "40 * * * *"
    misfire_grace_minutes: 15
    when: {sport: nfl, after_minutes: 75, before_minutes: 135}

  - id: nfl-model-predict-prekick
    source: nfl_model
    job: predict
    cron: "*/15 * * * *"
    misfire_grace_minutes: 10
    when: {sport: nfl, after_minutes: 0, before_minutes: 75}
