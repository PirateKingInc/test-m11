# Unattended polling schedule. Cron expressions are in `timezone`.
#
# `when` gates a job on the games table: it only runs if at least one not-final game of
# `sport` kicks off in (now + after_minutes, now + before_minutes]. A gated-out tick costs
# nothing and is not logged as a run. The QuotaManager still has the final say on spend.
#
# Check projected spend before changing anything:  betdata scheduler plan --days 30

timezone: America/New_York

defaults:
  priority: normal
  misfire_grace_minutes: 30  # if the machine was asleep at fire time, still run within this

jobs:
  # --- nflverse: free; schedule, scores, current and closing lines ---------------------
  - id: nflverse-schedules-morning
    source: nflverse
    job: schedules
    cron: "15 7 * * *"
    misfire_grace_minutes: 720

  - id: nflverse-schedules-night  # picks up final scores the same night
    source: nflverse
    job: schedules
    cron: "45 23 * * *"
    misfire_grace_minutes: 360

  # --- The Odds API (500 credits/month) -------------------------------------------------
  - id: odds-nfl-events  # free; keeps event ids current
    source: the_odds_api
    job: events
    params: {sport: nfl}
    cron: "30 6 * * *"
    misfire_grace_minutes: 720
    when: {sport: nfl, after_minutes: 0, before_minutes: 14400}  # games in next 10 days

  # One multi-book snapshot 0-60 min before every NFL kickoff window (London, 1pm, 4pm,
  # TNF/SNF/MNF, Saturdays, holidays). 3 credits per window, ~80 credits/month in season.
  # nflverse already supplies a free daily line, so no separate "opener" poll here.
  - id: odds-nfl-prekick
    source: the_odds_api
    job: odds
    params: {sport: nfl}
    cron: "50 * * * *"
    misfire_grace_minutes: 15
    when: {sport: nfl, after_minutes: 0, before_minutes: 60}

  # --- NBA, college basketball, college football ------------------------------------------
  # Until M5/M7 add schedule sources, these sports learn their games from The Odds API's free
  # /events list, so the events jobs are gated by month rather than by known games.
  # Worst-case month (Nov: all four sports, NBA weekend matinees every weekend): ~330 of
  # 450 usable credits. `betdata scheduler plan` gives the real projection once games load.

  - id: odds-nba-events
    source: the_odds_api
    job: events
    params: {sport: nba}
    cron: "35 6 * * *"
    misfire_grace_minutes: 720
    active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]

  - id: odds-nba-evening  # before the 7pm tips; covers every game through midnight
    source: the_odds_api
    job: odds
    params: {sport: nba}
    cron: "40 18 * * *"
    when: {sport: nba, after_minutes: 0, before_minutes: 330}

  - id: odds-nba-weekend-day  # weekend matinees (noon-4:30pm tips)
    source: the_odds_api
    job: odds
    params: {sport: nba}
    cron: "40 11 * * 0,6"
    when: {sport: nba, after_minutes: 0, before_minutes: 300}

  - id: odds-ncaab-events
    source: the_odds_api
    job: events
    params: {sport: ncaab}
    cron: "40 6 * * *"
    misfire_grace_minutes: 720
    active_months: [11, 12, 1, 2, 3, 4]

  - id: odds-ncaab-evening  # 6pm-midnight tips, where most weekday games are
    source: the_odds_api
    job: odds
    params: {sport: ncaab}
    cron: "40 17 * * *"
    when: {sport: ncaab, after_minutes: 0, before_minutes: 420}

  - id: odds-ncaab-saturday-day
    source: the_odds_api
    job: odds
    params: {sport: ncaab}
    cron: "40 11 * * 6"
    when: {sport: ncaab, after_minutes: 0, before_minutes: 330}

  - id: odds-ncaaf-events
    source: the_odds_api
    job: events
    params: {sport: ncaaf}
    cron: "45 6 * * *"
    misfire_grace_minutes: 720
    active_months: [8, 9, 10, 11, 12, 1]

  - id: odds-ncaaf-saturday  # before the noon, 3:30 and 7:30 Saturday windows
    source: the_odds_api
    job: odds
    params: {sport: ncaaf}
    cron: "40 11,15,19 * * 6"
    when: {sport: ncaaf, after_minutes: 0, before_minutes: 120}
