# The official NBA cards; "Spread Picks" added by owner decision 2026-11-10 (MODEL.md "Spread
# Picks card") (owner decision 2026-11-05, MODEL.md "Two official NBA cards").
# Display names and record rules only: stored picks keep their own signals (append-only ledger).
nba:
  default: nextgen  # the toggle's default when a viewer has no stored choice
  cards:
    nextgen:
      name: Next Gen
      what: the NBA engine's card
      signals: [engine]
      state: card  # poller state card:nba:<day>, ledger/card.csv
      since: 2026-11-05
      active: true  # false retires it: no new card is selected; its record stays
    og:
      name: OG
      what: Card v1 (F and C-NBA, nbap15/nba15-based)
      signals: [value, snipe]
      state: shadow  # poller state shadow:nba:<day>, ledger/shadow_card.csv
      # its record continues from Card v1's official picks (card.csv, before Next Gen)
      history_until: 2026-11-04
      # switch-over: lines were first seen on Nov 5 while F was archived; also annotated on
      # each such pick in ledger/annotations.csv (field og_excluded)
      exclude_days: [2026-11-05]
      # OG Ranking v2 (owner 2026-11-11, MODEL.md "OG Ranking v2"): its own ranking from this day
      ranking_v2_since: 2026-11-12
      active: true
    spread:
      name: Spread Picks
      what: official ATS pick on every Next Gen official-card ML underdog
      signals: [dogsprd]
      state: spread  # poller state spread:nba:<day>, ledger/spread_card.csv (betdata/spread.py)
      since: 2026-11-06
      active: true
    action:
      name: Action
      what: best 3 picks OG did not make official; not official
      signals: [snipe, value]  # the existing F / C-NBA picks (no new pick rows)
      state: action  # poller state action:nba:<day>, ledger/action_card.csv (betdata/action.py)
      since: 2026-11-13
      active: true
    # the OG + threes shadow (owner 2026-11-12): OG's rules with threes eligible; never official
    ogthrees:
      name: OG + threes (shadow)
      what: OG Ranking v2 with threes eligible; shadow only
      signals: [snipe, value]
      state: ogthrees  # poller state ogthrees:nba:<day>, ledger/og_threes_shadow.csv
      since: 2026-11-13
      active: false  # a shadow: no toggle, no record on the page (the review reads its file)
