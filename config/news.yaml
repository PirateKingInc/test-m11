sleeper:
  # free, read-only, non-commercial; Sleeper asks to stay under 1,000 calls a minute and to
  # fetch the full player list at most once a day
  trending: https://api.sleeper.app/v1/players/nba/trending/add
  players: https://api.sleeper.app/v1/players/nba
  every_minutes: 5
  lookback_hours: 1
  limit: 50
  spike: 3.0  # a player's adds at least 3x the previous check (and >= min_adds): a hint
  min_adds: 25
rotation_minutes: 15  # a rotation player: Next Gen projects >= 15 minutes
