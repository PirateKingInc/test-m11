# Sports on the page and in the hourly runner (M13). Order = tab order.
#
# An active sport names its plugin (betdata.sports.Sport) and the data jobs the hourly runner
# runs for it. Jobs use the scheduler's format (config/schedule.yaml): `cron` is US Eastern and
# on the hour, since the runner wakes once an hour from 7am to 10pm ET; a job runs on the hourly
# run whose time matches its cron. `when` gates on this sport's games (after/before minutes),
# and the QuotaManager has the final say on spend. Sources whose key is not set are skipped.
#
# Check projected spend before changing anything:  betdata scheduler plan --runner --days 30
#
# Adding a sport: an entry here (status coming_soon gives it a tab), then a plugin and jobs.

job_defaults:
  priority: normal
  misfire_grace_minutes: 60

sports:
  - key: nfl
    name: NFL
    status: active
    plugin: betdata.sports.nfl:NflSport
    jobs:
      # --- every hourly run: schedule, scores and current lines; injuries; rosters ----------
      - id: nfl-schedules  # nflverse games.csv: free; also final scores for grading
        source: nflverse
        job: schedules
        cron: "0 7-22 * * *"
      - id: nfl-injuries
        source: nflverse
        job: injuries
        cron: "0 7-22 * * *"
        active_months: [8, 9, 10, 11, 12, 1, 2]
      - id: nfl-rosters  # weekly status incl. game-day inactives once nflverse publishes them
        source: nflverse
        job: rosters
        cron: "0 7-22 * * *"
        active_months: [8, 9, 10, 11, 12, 1, 2]
      - id: nfl-sharp  # DraftKings + FanDuel (needs SHARPAPI_KEY); 1 call per run
        source: sharpapi
        job: odds
        params: {sport: nfl}
        cron: "0 7-22 * * *"
        when: {after_minutes: 0, before_minutes: 11520}
      # The Odds API (500 credits/month): its pre-kickoff snapshot, once per kickoff window, on
      # the run 0-60 minutes before kickoff (needs ODDS_API_KEY).
      - id: nfl-odds-prekick
        source: the_odds_api
        job: odds
        params: {sport: nfl}
        cron: "0 7-22 * * *"
        when: {after_minutes: 0, before_minutes: 60}
      - id: nfl-odds-events  # free call; keeps The Odds API's event ids current
        source: the_odds_api
        job: events
        params: {sport: nfl}
        cron: "0 7 * * *"
        when: {after_minutes: 0, before_minutes: 14400}
      - id: nfl-papi  # one Pinnacle board before the Sunday early games (needs ODDSPAPI_KEY)
        source: oddspapi
        job: odds
        params: {sport: nfl}
        cron: "0 11 * * 0"
        when: {after_minutes: 0, before_minutes: 150}
      - id: nfl-papi-primetime
        source: oddspapi
        job: odds
        params: {sport: nfl}
        cron: "0 19 * * 1,4"
        when: {after_minutes: 0, before_minutes: 150}
      - id: nfl-weather  # Open-Meteo forecasts for outdoor games, every 4 hours 7am-7pm
        source: open_meteo
        job: forecast
        params: {sport: nfl}
        cron: "0 7-22/4 * * *"
        when: {after_minutes: 0, before_minutes: 10080}
      - id: nfl-weather-archive  # archived forecasts for finished games (weather model history)
        source: open_meteo
        job: hist_forecast
        params: {sport: nfl}
        cron: "0 7 * * 2"
        active_months: [9, 10, 11, 12, 1, 2]
      # --- the first run of the day (7am): last week's play-by-play, stats, snaps, derive ----
      - id: nfl-pbp
        source: nflverse
        job: pbp
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-team-stats
        source: nflverse
        job: team_stats
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-snaps
        source: nflverse
        job: snaps
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-player-stats  # nflverse weekly player stats: prop inputs and prop grading (M15)
        source: nflverse_extra
        job: player_stats
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-depth-charts  # ESPN-id -> gsis-id map for prop lines (daily snapshots, M15)
        source: nflverse_extra
        job: depth_charts
        cron: "0 7 * * *"
        active_months: [8, 9, 10, 11, 12, 1, 2]
      - id: nfl-pfr-pass  # PFR weekly pressures: m15's pressure source while 2026 has no participation
        source: nflverse_extra
        job: pfr_pass
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-ngs-passing  # NGS time to throw (one all-season file): m15's fallback (M15)
        source: nflverse_extra
        job: ngs_passing
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-participation  # skipped until nflverse publishes this season's file (M15)
        source: nflverse_extra
        job: participation
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-derive  # local: derived tables from the files above (no network)
        source: nfl_model
        job: derive
        cron: "0 7 * * *"
        active_months: [9, 10, 11, 12, 1, 2]
      - id: nfl-inputs15  # local: m15 and prop live inputs in data/derived from the files above
        source: nfl_model
        job: inputs15
        cron: "0 7 * * *"
        active_months: [8, 9, 10, 11, 12, 1, 2]
      # M18 Part E: no ESPN prop or odds endpoint is called. DK/FD props come from the
      # poller's SharpAPI sweeps (props/sharp_import.py, copied in every hourly run).

  - key: nba
    name: NBA
    status: active
    plugin: betdata.sports.nba:NbaSport
    jobs:
      # --- every hourly run in season: schedule and scores (ESPN; its odds are not read, M18),
      # box scores of newly finished games, the latest official injury report --------------
      - id: nba-scoreboard  # games yesterday to 2 days ahead; no key, no quota
        source: espn_nba
        job: scoreboard
        cron: "0 7-22 * * *"
        active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]
      - id: nba-boxscores  # one call per newly finished game (feeds player values)
        source: espn_nba
        job: boxscores
        cron: "0 7-22 * * *"
        active_months: [10, 11, 12, 1, 2, 3, 4, 5, 6]
      - id: nba-injuries  # the league's latest report (one PDF per run)
        source: nba_injury
        job: report
        cron: "0 7-22 * * *"
        when: {after_minutes: 0, before_minutes: 2880}
      # --- keyed sources (skipped while their secret is unset), inside existing quotas ------
      - id: nba-sharp  # DraftKings + FanDuel (needs SHARPAPI_KEY); 1 call per run
        source: sharpapi
        job: odds
        params: {sport: nba}
        cron: "0 7-22 * * *"
        when: {after_minutes: 0, before_minutes: 2880}
      - id: nba-odds-evening  # The Odds API: one board a day before the evening tips
        source: the_odds_api
        job: odds
        params: {sport: nba}
        cron: "0 18 * * *"
        when: {after_minutes: 0, before_minutes: 180}
      - id: nba-papi  # one Pinnacle board a day (needs ODDSPAPI_KEY)
        source: oddspapi
        job: odds
        params: {sport: nba}
        cron: "0 17 * * *"
        when: {after_minutes: 0, before_minutes: 240}
